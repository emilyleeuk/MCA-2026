<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Verovio Score</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #app {
      width: 100%;
      height: 100%;
    }
  </style>

</head>

<body>

  <div id="app">Verovio is loading...</div>

  <script type="module">

    import 'https://www.verovio.org/javascript/app/verovio-app.js';

    const options = {
      defaultView: 'responsive',
      defaultZoom: 3,
      enableResponsive: true,
      enableDocument: true
    };

    var file = 'data/week3-mozart.mei?v=2';

    const app = new Verovio.App(
      document.getElementById("app"),
      options
    );

    fetch(file)
      .then(function(response) {
        return response.text();
      })
      .then(function(text) {
        app.loadData(text);
      });

  </script>

</body>

</html>
