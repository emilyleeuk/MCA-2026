<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Emily's MCA Portfolio</title>

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;

      background-image: url('data/music-background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      color: white;
    }

    .overlay {
      width: 100%;
      height: 100vh;

      background: rgba(40, 25, 15, 0.48);

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .content {
      width: 95%;
      max-width: 1200px;
    }

    h1 {
      font-size: 60px;
      margin: 0 0 20px 0;
    }

    h2 {
      font-size: 26px;
      font-weight: normal;
      margin: 0 0 10px 0;
    }

    .name {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .description {
      font-size: 17px;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .buttons a {
      display: inline-block;

      padding: 14px 20px;

      border: 2px solid white;

      color: white;
      text-decoration: none;

      background: rgba(0, 0, 0, 0.15);

      font-size: 16px;
    }

    .buttons a:hover {
      background: white;
      color: #4a3425;
    }

  </style>

</head>


<body>

  <div class="overlay">

    <div class="content">

      <h1>Music Curation and Analytics</h1>

</html>
